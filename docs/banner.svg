    <rect x="852" y="58" width="320" height="304" rx="12" fill="#202020" stroke="#FFFFFF" stroke-opacity=".08"/>
    <circle cx="884" cy="96" r="10" fill="none" stroke="#3FD16A" stroke-width="3"/>
