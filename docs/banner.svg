    <radialGradient id="g2" cx="0.82" cy="0.55" r="0.42"><stop offset="0" stop-color="#3FD16A" stop-opacity=".22"/><stop offset="1" stop-color="#3FD16A" stop-opacity="0"/></radialGradient>
