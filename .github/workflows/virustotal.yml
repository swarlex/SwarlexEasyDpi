# A release's exe goes to VirusTotal, and the link to the scan is added to the release notes, so anyone can see
# what the antivirus engines make of it. Runs when a release is published, or by hand for a given tag. Needs the
# repository secret VT_API_KEY (a free VirusTotal API key); without it nothing is scanned.
name: VirusTotal

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to scan (e.g. v1.1.0)
        required: true

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Scan the release exe and link the scan in the release notes
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "$VT_API_KEY" ]; then echo "No VT_API_KEY secret: nothing scanned."; exit 0; fi
          for i in $(seq 1 30); do
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 'SwarlexEasyDpi.exe' -D files --clobber 2>/dev/null && [ -f files/SwarlexEasyDpi.exe ] && break
            sleep 10
          done
          f=files/SwarlexEasyDpi.exe
          [ -f "$f" ] || { echo "No release file found."; exit 0; }
          sha=$(sha256sum "$f" | cut -d' ' -f1)
          curl -sS --fail -o /dev/null -X POST https://www.virustotal.com/api/v3/files -H "x-apikey: $VT_API_KEY" -F "file=@$f" || echo "upload failed"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body -q .body > notes.md
          if grep -q 'virustotal.com' notes.md; then echo "Already linked."; exit 0; fi
          printf '\n\n**VirusTotal:** [SwarlexEasyDpi.exe](https://www.virustotal.com/gui/file/%s)\n' "$sha" >> notes.md
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file notes.md
